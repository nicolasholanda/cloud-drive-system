server:
  port: 8080

spring:
  application:
    name: cloud-drive-system
  datasource:
    url: jdbc:postgresql://localhost:5432/clouddrive
    username: clouddrive
    password: clouddrive
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: change-this-to-a-long-random-string-in-production-env-var
  expiration-minutes: 60

cloud:
  aws:
    s3:
      endpoint: http://localhost:4566
      region: us-east-1
      access-key: test
      secret-key: test
      bucket: clouddrive-blocks
